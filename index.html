<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Linux Terminal & Prompt Hub</title>
    <style>
        /* Modern Dark Terminal UI Design */
        body {
            background-color: #0d0e11;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Layout wrapper */
        .page-wrapper {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top control utility panel for copying the master prompt */
        .utility-panel {
            background-color: #1c212c;
            border: 1px dashed #ffbd2e;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .utility-text {
            color: #8e9aa8;
            font-size: 0.9rem;
        }

        .prompt-copy-btn {
            background-color: #ffbd2e;
            color: #12131a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .prompt-copy-btn:hover {
            background-color: #ffe082;
            box-shadow: 0 0 8px rgba(255, 189, 46, 0.4);
        }

        /* Mac-Style OS Terminal Window Box */
        .terminal-container {
            background-color: #161920;
            border: 1px solid #2f3645;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Mac Window Header Window Management Line */
        .terminal-header {
            background-color: #202530;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2f3645;
            user-select: none;
        }

        .window-buttons {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }
